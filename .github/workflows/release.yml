name: Release
# Builds the Windows installer and the Ubuntu .deb and proves each: install, the installed app's
# selfcheck, uninstall. PR and manual runs keep them as artifacts; a v* tag publishes a GitHub
# release with both.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/build.ps1"
      - "scripts/build.sh"
      - "scripts/make_deb.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: uv sync --locked
      - name: Read the version
        id: version
        run: |
          $version = uv run python -c "import tamra; print(tamra.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:TAG -cne "v$env:VERSION") { throw "Tag $env:TAG does not match tamra.__version__ $env:VERSION (expected v$env:VERSION)" }
      - name: Inno Setup
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if ($iscc) { "Using $iscc"; exit 0 }
          choco install innosetup --version=6.4.3 -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the installer
        run: ./scripts/build.ps1 -Installer
      - name: Silent install
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = "dist\Tamra-Setup-$env:VERSION.exe"
          if (-not (Test-Path $setup)) { throw "$setup was not built" }
          $env:INSTALL_DIR = "$env:RUNNER_TEMP\Tamra-install"
          "INSTALL_DIR=$env:INSTALL_DIR" >> $env:GITHUB_ENV
          $log = "$env:RUNNER_TEMP\install.log"
          $p = Start-Process $setup -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES",
            "/NORESTART", "/CURRENTUSER", "/DIR=`"$env:INSTALL_DIR`"", "/LOG=`"$log`""
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$env:INSTALL_DIR\Tamra.exe")) {
            Get-Content $log
            throw "Setup exited with $($p.ExitCode); Tamra.exe installed: $(Test-Path "$env:INSTALL_DIR\Tamra.exe")"
          }
      - name: Selfcheck the installed exe
        run: |
          $report = "$env:RUNNER_TEMP\selfcheck.json"
          $p = Start-Process "$env:INSTALL_DIR\Tamra.exe" -ArgumentList "selfcheck", "--report", $report -Wait -PassThru
          if (-not (Test-Path $report)) { throw "No selfcheck report (exit code $($p.ExitCode))" }
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "Selfcheck exited with $($p.ExitCode)" }
      - name: Silent uninstall
        run: |
          $log = "$env:RUNNER_TEMP\uninstall.log"
          $p = Start-Process "$env:INSTALL_DIR\unins000.exe" -Wait -PassThru -ArgumentList "/VERYSILENT",
            "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=`"$log`""
          # The uninstaller hands over to a copy of itself in %TEMP%, so wait for the files to go.
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path "$env:INSTALL_DIR\Tamra.exe") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if ($p.ExitCode -ne 0 -or (Test-Path "$env:INSTALL_DIR\Tamra.exe")) {
            if (Test-Path $log) { Get-Content $log }
            throw "Uninstall exited with $($p.ExitCode); Tamra.exe still there: $(Test-Path "$env:INSTALL_DIR\Tamra.exe")"
          }
      - name: Write the sha256
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "Tamra-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD\dist\$name.sha256", "$hash  $name`n")
          Get-Content "dist\$name.sha256"
          "Installer size: $((Get-Item "dist\$name").Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: Tamra-Setup
          path: |
            dist/Tamra-Setup-${{ steps.version.outputs.version }}.exe
            dist/Tamra-Setup-${{ steps.version.outputs.version }}.exe.sha256
          if-no-files-found: error

  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build tools, the libraries the .deb depends on, and a keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(cat packaging/linux/build-packages.txt) gnome-keyring
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: uv sync --locked
      - name: Read the version
        id: version
        run: echo "version=$(uv run python -c 'import tamra; print(tamra.__version__)')" >> "$GITHUB_OUTPUT"
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then echo "Tag $TAG does not match tamra.__version__ $VERSION (expected v$VERSION)"; exit 1; fi
      - run: ./scripts/build.sh --deb
      - name: Install the .deb
        # Without its Recommends (fonts, Mesa, zenity: ~100 MB the check does not need).
        run: sudo apt-get install -y --no-install-recommends ./dist/tamra_${{ steps.version.outputs.version }}_amd64.deb
      - name: Selfcheck the installed app
        run: |
          test -x /opt/tamra/_internal/vendor/llama/llama-server
          status=0
          scripts/with_keyring.sh tamra selfcheck --report selfcheck.json || status=1
          scripts/with_keyring.sh xvfb-run -a tamra selfcheck --window --report window.json || status=1
          cat selfcheck.json window.json
          exit $status
      - name: Remove the package
        run: |
          sudo apt-get remove -y tamra
          test ! -e /opt/tamra
      - name: Write the sha256
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          sha256sum "tamra_${VERSION}_amd64.deb" > "tamra_${VERSION}_amd64.deb.sha256"
          cat "tamra_${VERSION}_amd64.deb.sha256"
          echo "Package size: $(stat -c %s "tamra_${VERSION}_amd64.deb") bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: Tamra-deb
          path: |
            dist/tamra_${{ steps.version.outputs.version }}_amd64.deb
            dist/tamra_${{ steps.version.outputs.version }}_amd64.deb.sha256
          if-no-files-found: error

  release:
    needs: [installer, deb]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tamra-Setup
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Tamra-deb
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.installer.outputs.version }}
        run: |
          gh release create $env:TAG "dist/Tamra-Setup-$env:VERSION.exe" "dist/Tamra-Setup-$env:VERSION.exe.sha256" `
            "dist/tamra_$($env:VERSION)_amd64.deb" "dist/tamra_$($env:VERSION)_amd64.deb.sha256" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
