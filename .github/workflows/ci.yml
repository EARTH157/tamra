name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: uv sync --locked
      - run: ./scripts/build.ps1
        shell: pwsh
      - name: Selfcheck packaged exe
        shell: pwsh
        run: |
          if (-not (Test-Path dist\Tamra\_internal\vendor\llama\llama-server.exe)) { throw "llama-server.exe not bundled" }
          $p = Start-Process dist\Tamra\Tamra.exe -ArgumentList "selfcheck","--report","selfcheck.json" -Wait -PassThru
          Get-Content selfcheck.json
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Tamra-windows
          path: dist/Tamra
