name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Fonts and Qt libraries the tests use
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(cat packaging/linux/build-packages.txt)
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: uv sync --locked
      - run: ./scripts/build.ps1
        shell: pwsh
      - name: Selfcheck packaged exe
        shell: pwsh
        run: |
          if (-not (Test-Path dist\Tamra\_internal\vendor\llama\llama-server.exe)) { throw "llama-server.exe not bundled" }
          $p = Start-Process dist\Tamra\Tamra.exe -ArgumentList "selfcheck","--report","selfcheck.json" -Wait -PassThru
          Get-Content selfcheck.json
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Tamra-windows
          path: dist/Tamra

  package-ubuntu:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build tools, the libraries the .deb depends on, and a keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(cat packaging/linux/build-packages.txt) gnome-keyring
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: uv sync --locked
      - run: ./scripts/build.sh --deb
      - name: Install the .deb
        # Without its Recommends (fonts, Mesa, zenity: ~100 MB the check does not need).
        run: sudo apt-get install -y --no-install-recommends ./dist/tamra_*_amd64.deb
      - name: Selfcheck the installed app
        run: |
          test -x /opt/tamra/_internal/vendor/llama/llama-server
          # Restrict user namespaces through AppArmor, as Ubuntu Desktop does, so the window check
          # also checks the profile the package installs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          status=0
          scripts/with_keyring.sh tamra selfcheck --report selfcheck.json || status=1
          scripts/with_keyring.sh xvfb-run -a tamra selfcheck --window --report window.json || status=1
          cat selfcheck.json window.json
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: Tamra-ubuntu
          path: dist/tamra_*_amd64.deb
          if-no-files-found: error
