[project]
name = "tamra"
version = "0.1.0"
description = "Offline-first Windows app for asking questions about your documents, with verifiable citations."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "numpy>=2.0",
  "onnxruntime>=1.19",
  "tokenizers>=0.20",
  "sqlite-vec>=0.1.6",
  "pywebview>=5.3",
]

[project.scripts]
tamra = "tamra.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tamra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["assets: needs downloaded models/binaries (run scripts/fetch_assets.py)"]
addopts = "-m 'not assets'"

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff 0.16+ also formats Python code blocks inside Markdown. Plans and specs hold
# illustrative snippets, so keep every .md file out of ruff.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
